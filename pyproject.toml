[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothing_on_sphere"
version = "6.0.0"
description = "Area-weighted smoothing of fields on a sphere using KD-trees and overlap detection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "Gregor Skok", email = "Gregor.Skok@fmf.uni-lj.si"}]
dependencies = ["numpy>=1.23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
examples = ["netCDF4", "matplotlib>=3.5", "cartopy"]

[project.urls]
Homepage = "https://github.com/skokg/Smoothing_on_Sphere"
Repository = "https://github.com/skokg/Smoothing_on_Sphere"
Issues = "https://github.com/skokg/Smoothing_on_Sphere/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["smoothing_on_sphere"]
packages = []
include-package-data = false
